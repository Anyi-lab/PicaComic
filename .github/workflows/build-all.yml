name: Build All Clients

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: macos-latest
            platform: ios
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/share/swift /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/extras \
            /usr/local/lib/android/sdk/cmdline-tools
          df -h / | tail -1

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop platforms
        if: contains(fromJSON('["windows","macos","linux"]'), matrix.platform)
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Generate debug keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=debug\nstoreFile=/tmp/debug.keystore\n' > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Patch inappwebview for new MSVC (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          PLUGIN_DIR=$(find windows/flutter/ephemeral/.plugin_symlinks -maxdepth 1 -name 'flutter_inappwebview_windows' 2>/dev/null | head -1)
          [ -z "$PLUGIN_DIR" ] && PLUGIN_DIR=$(find "$USERPROFILE/AppData/Local/Pub/Cache" -path '*flutter_inappwebview_windows' -maxdepth 3 -type d 2>/dev/null | head -1)
          echo "Plugin dir: $PLUGIN_DIR"
          [ -z "$PLUGIN_DIR" ] && { echo "ERROR: Plugin dir not found!"; exit 1; }

          CMAKE_F="$PLUGIN_DIR/windows/CMakeLists.txt"
          if [ -f "$CMAKE_F" ]; then
            echo "Patching CMakeLists.txt"
            sed -i \
              -e 's|WIL_VERSION "1.0.231216.1"|WIL_VERSION "1.0.260126.7"|' \
              -e 's|WEBVIEW_VERSION "1.0.2849.39"|WEBVIEW_VERSION "1.0.4191.47"|' \
              -e 's|CPP_WINRT_VERSION "2.0.240405.15"|CPP_WINRT_VERSION "3.0.260818.1"|' \
              -e 's|cxx_std_17|cxx_std_20|g' \
              "$CMAKE_F"
            find "/c/Program Files/Microsoft Visual Studio" -type f -path "*/experimental/coroutine" 2>/dev/null | while read -r MSVC_CORO_HDR; do
              echo "Patching MSVC header (STL1011 suppression): $MSVC_CORO_HDR"
              sed -i '1a #define _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' "$MSVC_CORO_HDR"
            done
            for GLOB_HDR in "/c/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Tools/MSVC/"*/include/experimental/coroutine; do
              if [ -f "$GLOB_HDR" ]; then
                echo "Patching MSVC toolset header (glob, STL1011): $GLOB_HDR"
                sed -i '1a #define _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' "$GLOB_HDR"
              fi
            done
            sed -i '/cmake_minimum_required/a add_definitions(-D_ALLOW_DEPRECATED_EXPERIMENTAL_DEFINITIONS -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' "$CMAKE_F"
          fi

          TYPES_DIR="$PLUGIN_DIR/windows/types"
          for HFILE in "$TYPES_DIR"/*.h; do
            [ -f "$HFILE" ] && sed -i -E 's/([A-Z][a-zA-Z0-9_]+::(operator[!=]=))/\2/g' "$HFILE"
          done
          [ -f "$TYPES_DIR/web_resource_response.h" ] && \
            sed -i 's/WebResourceResponse::toWebView2Response/toWebView2Response/g' "$TYPES_DIR/web_resource_response.h"
          PU_H="$PLUGIN_DIR/windows/platform_util.h"
          [ -f "$PU_H" ] && \
            sed -i -E 's/PlatformUtil::(HandleWindowProc|_EmitEvent)/\1/g' "$PU_H"
          PL_H="$PLUGIN_DIR/windows/flutter_inappwebview_windows_plugin.h"
          [ -f "$PL_H" ] && \
            sed -i 's/FlutterInappwebviewWindowsPlugin::HandleWindowProc/HandleWindowProc/g' "$PL_H"
          echo "Patched C4596 in all affected headers"

          UTIL_H="$PLUGIN_DIR/windows/utils/util.h"
          if [ -f "$UTIL_H" ]; then
            { echo "template<typename T>"; echo "constexpr bool always_false_v = false;"; cat "$UTIL_H"; } > "$UTIL_H.tmp" && mv "$UTIL_H.tmp" "$UTIL_H"
            echo "Patched always_false_v"
          fi
          STR_H="$PLUGIN_DIR/windows/utils/string.h"
          if [ -f "$STR_H" ]; then
            sed -i '/void to_uppercase/{s/const std::basic_string<T>& s/std::basic_string<T>\& s/;}' "$STR_H"
            sed -i '/^\s*return s2;$/d' "$STR_H"
            echo "Patched to_uppercase in string.h"
            sed -i 's/\[delim\](auto& a, auto& b)/[delim](const std::basic_string<T>\& a, const std::basic_string<T>\& b)/g' "$STR_H"
            echo "Patched join() lambda in string.h"
          fi

      - name: Build android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --split-per-abi > build.log 2>&1 || true
          ls build/app/outputs/flutter-apk/*.apk
          tail -5 build.log

      - name: Build windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macos
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build ios
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -r Payload.ipa Payload && rm -rf Payload)

      - name: Build linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/**
            build/macos/Build/Products/Release/*.app/**
            build/ios/iphoneos/Runner.app/**
            build/ios/Payload.ipa
            build/linux/x64/release/bundle/**
          if-no-files-found: warn

  release:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +"%Y%m%d")
          TAG="v${DATE}.${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Zip each platform artifact
        run: |
          cd artifacts
          for dir in */; do
            platform="${dir%/}"
            echo "Zipping $platform..."
            (cd "$dir" && zip -r "../${platform}.zip" .)
          done
          ls -lh ../*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }} — Auto Release"
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
