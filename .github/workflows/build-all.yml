name: Build All Clients

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: macos-latest
            platform: ios
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/share/swift /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/extras \
            /usr/local/lib/android/sdk/cmdline-tools
          df -h / | tail -1

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop platforms
        if: contains(fromJSON('["windows","macos","linux"]'), matrix.platform)
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Generate debug keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=debug\nstoreFile=/tmp/debug.keystore\n' > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Patch inappwebview SDK for new MSVC (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          F=$(find "$USERPROFILE/AppData/Local/Pub/Cache" -path '*flutter_inappwebview_windows/windows/CMakeLists.txt' 2>/dev/null | head -1)
          [ -z "$F" ] && F=$(find . -path '*flutter_inappwebview_windows/windows/CMakeLists.txt' 2>/dev/null | head -1)
          echo "Patching inappwebview windows CMakeLists: $F"
          if [ -n "$F" ]; then
            sed -i \
              -e 's|WIL_VERSION "1.0.231216.1"|WIL_VERSION "1.0.260126.7"|' \
              -e 's|cxx_std_17|cxx_std_20|g' \
              "$F"
          fi

      - name: Build android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --split-per-abi > build.log 2>&1 || true
          ls build/app/outputs/flutter-apk/*.apk
          tail -5 build.log

      - name: Build windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macos
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build ios
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Build linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/**
            build/macos/Build/Products/Release/*.app/**
            build/ios/iphoneos/Runner.app/**
            build/linux/x64/release/bundle/**
          if-no-files-found: warn
