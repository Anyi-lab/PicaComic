name: Build All Clients

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: macos-latest
            platform: ios
          - os: windows-latest
            platform: windows

    steps:
      - name: Set up job
        run: echo "Building ${{ matrix.platform }} on ${{ matrix.os }}"

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Free disk space (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Run subosito/flutter-action@v2
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop platforms
        run: flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop

      - name: Prepare Android Signing
        if: matrix.platform == 'android'
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing; skipping signing setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Pub get
        run: flutter pub get

      - name: Patch inappwebview for new MSVC (Windows)
        if: matrix.platform == 'windows'
        run: |
          sed -i 's/#include <winrt\/Windows.Foundation.h>/#include <unknwn.h>\n#include <winrt\/Windows.Foundation.h>/g' \
            $(find ~/.pub-cache/hosted/pub.dev -name "webview_environment.cpp" 2>/dev/null || true)

      - name: Build android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --split-per-abi 2>&1 | tail -50
          ls -la build/app/outputs/flutter-apk/ || echo "APK output directory not found"

      - name: Build windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macos
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build ios
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -r Payload.ipa Payload && rm -rf Payload)

      - name: Build linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/**
            build/macos/Build/Products/Release/*.app/**
            build/ios/iphoneos/Runner.app/**
            build/ios/Payload.ipa
            build/linux/x64/release/bundle/**
