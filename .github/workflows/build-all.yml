name: Build All Clients

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: macos-latest
            platform: ios
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/share/swift /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/extras \
            /usr/local/lib/android/sdk/cmdline-tools
          df -h / | tail -1

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop platforms
        if: contains(fromJSON('["windows","macos","linux"]'), matrix.platform)
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Generate debug keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=debug\nstoreFile=/tmp/debug.keystore\n' > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Patch inappwebview for new MSVC (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # Find plugin dir via symlink or pub cache
          PLUGIN_DIR=$(find windows/flutter/ephemeral/.plugin_symlinks -maxdepth 1 -name 'flutter_inappwebview_windows' 2>/dev/null | head -1)
          [ -z "$PLUGIN_DIR" ] && PLUGIN_DIR=$(find "$USERPROFILE/AppData/Local/Pub/Cache" -path '*flutter_inappwebview_windows' -maxdepth 3 -type d 2>/dev/null | head -1)
          echo "Plugin dir: $PLUGIN_DIR"
          [ -z "$PLUGIN_DIR" ] && { echo "ERROR: Plugin dir not found!"; exit 1; }

          # 1) Upgrade CMake SDK versions + cxx_std_17→cxx_std_20
          CMAKE_F="$PLUGIN_DIR/windows/CMakeLists.txt"
          if [ -f "$CMAKE_F" ]; then
            echo "Patching CMakeLists.txt"
            sed -i \
              -e 's|WIL_VERSION "1.0.231216.1"|WIL_VERSION "1.0.260126.7"|' \
              -e 's|WEBVIEW_VERSION "1.0.2849.39"|WEBVIEW_VERSION "1.0.4191.47"|' \
              -e 's|CPP_WINRT_VERSION "2.0.240405.15"|CPP_WINRT_VERSION "3.0.260818.1"|' \
              -e 's|cxx_std_17|cxx_std_20|g' \
              "$CMAKE_F"
            # Suppress experimental/coroutine deprecation (STL1011)
            # Patch the MSVC STL header directly to neuter the static_assert
            MSVC_CORO_HDR=$(find "/c/Program Files/Microsoft Visual Studio" -path "*/include/experimental/coroutine" -type f 2>/dev/null | head -1)
            if [ -n "$MSVC_CORO_HDR" ]; then
              echo "Patching MSVC header: $MSVC_CORO_HDR"
              sed -i 's/_EMIT_STL_ERROR(STL1011/_EMIT_STL_ERROR(STL1011_/' "$MSVC_CORO_HDR"
              sed -i 's/_EMIT_STL_ERROR(STL1010/_EMIT_STL_ERROR(STL1010_/' "$MSVC_CORO_HDR"
            fi
            # Also define the macro as fallback for any include path
            sed -i '/cmake_minimum_required/a add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' "$CMAKE_F"
          fi

          # 2) Fix C4596: remove ClassName:: from operator==/!= and specific method decls
          # Be precise — do NOT touch enum value accesses like EnumType::value
          TYPES_DIR="$PLUGIN_DIR/windows/types"

          # operator== and operator!= qualified names (ClassName::operator== → operator==)
          for HFILE in "$TYPES_DIR"/permission_response.h "$TYPES_DIR"/server_trust_auth_response.h \
                        "$TYPES_DIR"/size_2d.h "$TYPES_DIR"/rect.h \
                        "$TYPES_DIR"/download_start_response.h; do
            [ -f "$HFILE" ] && sed -i -E 's/([A-Z][a-zA-Z0-9_]+::(operator[!=]=))/\2/g' "$HFILE"
          done

          # web_resource_response.h: WebResourceResponse::toWebView2Response
          [ -f "$TYPES_DIR/web_resource_response.h" ] && \
            sed -i 's/WebResourceResponse::toWebView2Response/toWebView2Response/g' "$TYPES_DIR/web_resource_response.h"

          # platform_util.h: PlatformUtil::HandleWindowProc, PlatformUtil::_EmitEvent
          PU_H="$PLUGIN_DIR/windows/platform_util.h"
          [ -f "$PU_H" ] && \
            sed -i -E 's/PlatformUtil::(HandleWindowProc|_EmitEvent)/\1/g' "$PU_H"

          # flutter_inappwebview_windows_plugin.h: FlutterInappwebviewWindowsPlugin::HandleWindowProc
          PL_H="$PLUGIN_DIR/windows/flutter_inappwebview_windows_plugin.h"
          [ -f "$PL_H" ] && \
            sed -i 's/FlutterInappwebviewWindowsPlugin::HandleWindowProc/HandleWindowProc/g' "$PL_H"

          echo "Patched C4596 in all affected headers"

          # 3) Fix always_false_v: add missing template definition before first use
          UTIL_H="$PLUGIN_DIR/windows/utils/util.h"
          if [ -f "$UTIL_H" ]; then
            # Insert template definition at line 1 (before any usage at line 27+)
            { echo "template<typename T>"; echo "constexpr bool always_false_v = false;"; cat "$UTIL_H"; } > "$UTIL_H.tmp" && mv "$UTIL_H.tmp" "$UTIL_H"
            echo "Patched always_false_v"
          fi

      - name: Build android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --split-per-abi > build.log 2>&1 || true
          ls build/app/outputs/flutter-apk/*.apk
          tail -5 build.log

      - name: Build windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macos
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build ios
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -r Payload.ipa Payload && rm -rf Payload)

      - name: Build linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/windows/x64/runner/Release/**
            build/macos/Build/Products/Release/*.app/**
            build/ios/iphoneos/Runner.app/**
            build/ios/Payload.ipa
            build/linux/x64/release/bundle/**
          if-no-files-found: warn
