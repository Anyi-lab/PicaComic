name: Build Android Coexist

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            if ! keytool -list -keystore /tmp/release.keystore \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::release keystore failed to load - check ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
              exit 1
            fi
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=/tmp/release.keystore\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
              > android/key.properties
            chmod 600 /tmp/release.keystore android/key.properties
            echo "signing with release keystore from Secrets"
          else
            keytool -genkeypair -v -keystore /tmp/debug.keystore -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            printf 'storePassword=android\nkeyPassword=android\nkeyAlias=debug\nstoreFile=/tmp/debug.keystore\n' > android/key.properties
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - falling back to a throwaway debug keystore"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build apk
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/*.apk