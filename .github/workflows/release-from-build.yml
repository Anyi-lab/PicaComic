name: Release from Existing Build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to download artifacts from'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          echo "Downloading artifacts from run $RUN_ID..."

          # List artifacts
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | "\(.id) \(.name)"')
          echo "$ARTIFACTS"

          mkdir -p artifacts
          while IFS=' ' read -r ID NAME; do
            echo "Downloading $NAME (id=$ID)..."
            gh api repos/${{ github.repository }}/actions/artifacts/$ID/zip -H "Accept: application/vnd.github+json" > "artifacts/$NAME.zip"
          done <<< "$ARTIFACTS"

          ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "v1.0.0"
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
